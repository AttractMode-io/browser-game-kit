<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Achievement rules sandbox | Attract Mode kit</title><meta name="description" content="Silent local achievement simulation. No real accounts or awards."><link rel="stylesheet" href="/sample.css"><link rel="stylesheet" href="/integrations/achievement-panel.css"></head><body><main>
<h1>Achievement rules sandbox</h1><p>Local simulation only. These outcomes create no Attract Mode accounts, XP or public awards. No audio plays.</p>
<p>Win the harbor level to earn First crossing once. A loss, another level and a repeated event must not grant its XP again.</p>
<div class="controls"><button id="loss" type="button">Lose harbor</button><button id="win" type="button">Win harbor</button><button id="other" type="button">Win forest</button><button id="retry" type="button" disabled>Retry last event</button><button id="reset" type="button">Reset simulation</button></div>
<section id="achievements" aria-label="Achievement simulation"></section><h2>Evaluation trace</h2><pre id="trace" aria-live="polite"></pre><p><a href="/">Back to game</a></p>
</main><script type="module" src="/examples/achievements.mjs"></script></body></html>
