name: Release kit
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:agents
      - run: npm --prefix mcp ci --ignore-scripts
      - run: npm --prefix mcp test
      - name: Build source ZIP and checksum
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=attract-mode-browser-game-kit/ HEAD > dist/attract-mode-browser-game-kit.zip
          cd dist
          sha256sum attract-mode-browser-game-kit.zip > SHA256SUMS.txt
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/attract-mode-browser-game-kit.zip dist/SHA256SUMS.txt --verify-tag --title "Browser game kit $RELEASE_TAG" --notes-file .github/release-notes.md
