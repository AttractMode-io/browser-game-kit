name: Release kit
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify or publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:agents
      - run: npm --prefix mcp ci --ignore-scripts
      - run: npm --prefix mcp test
      - name: Build source ZIP and checksum
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=attract-mode-browser-game-kit/ HEAD > dist/attract-mode-browser-game-kit.zip
          cd dist
          sha256sum attract-mode-browser-game-kit.zip > SHA256SUMS.txt
      - name: Verify extracted ZIP
        run: |
          unzip -q dist/attract-mode-browser-game-kit.zip -d /tmp/kit-release
          cd /tmp/kit-release/attract-mode-browser-game-kit
          npm ci --ignore-scripts
          npm run doctor
          npm run test:release
      - name: Publish checked release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p existing
            gh release download "$RELEASE_TAG" --pattern attract-mode-browser-game-kit.zip --pattern SHA256SUMS.txt --dir existing
            (cd existing && sha256sum --check SHA256SUMS.txt)
            python3 - <<'PYZIP'
          import zipfile
          def files(path):
              with zipfile.ZipFile(path) as archive:
                  names = [n for n in archive.namelist() if not n.endswith('/')]
                  assert len(names) == len(set(names)), "Duplicate archive entries"
                  return {n: archive.read(n) for n in names}
          assert files('existing/attract-mode-browser-game-kit.zip') == files('dist/attract-mode-browser-game-kit.zip'), "Published source differs from tag"
          print('Existing release verified; no assets replaced.')
          PYZIP
          else
            gh release create "$RELEASE_TAG" dist/attract-mode-browser-game-kit.zip dist/SHA256SUMS.txt --verify-tag --title "Browser game kit $RELEASE_TAG" --notes-file .github/release-notes.md
          fi
