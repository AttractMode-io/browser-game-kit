name: Kit checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run doctor
      - run: npm test
      - run: npm run test:agents
      - run: npm --prefix mcp ci --ignore-scripts
      - run: npm --prefix mcp test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix mcp audit --omit=dev --audit-level=high
      - name: Verify clean source ZIP
        run: |
          git archive --format=zip --prefix=kit/ HEAD > /tmp/kit.zip
          unzip -q /tmp/kit.zip -d /tmp/kit-release
          cd /tmp/kit-release/kit
          npm ci --ignore-scripts
          npm run doctor
          npm run test:release
